<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Sine Relax 2</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=satoshi@300,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --font: 'Satoshi', sans-serif;
    --silver: rgba(200,205,210,0.55);
    --silver-dim: rgba(200,205,210,0.22);
    --silver-ghost: rgba(200,205,210,0.08);
    --ease: 180ms cubic-bezier(0.16,1,0.3,1);
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:var(--font); }

  /* ── Canvas ── */
  #canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

  /* ── Loading ── */
  #loading {
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:#000; color:var(--silver-dim);
    font-size:clamp(0.6rem,1.1vw,0.7rem); letter-spacing:0.22em; text-transform:uppercase;
    opacity:1; transition:opacity 1.4s cubic-bezier(0.16,1,0.3,1);
  }
  #loading.hidden { opacity:0; pointer-events:none; }

  /* ── Title ── */
  #title {
    position:fixed; top:clamp(1.8rem,4.5vw,3rem); left:50%; transform:translateX(-50%);
    z-index:10; color:var(--silver-dim);
    font-size:clamp(0.6rem,1.1vw,0.7rem); font-weight:300;
    letter-spacing:0.22em; text-transform:uppercase; white-space:nowrap;
  }

  /* ── Bottom UI ── */
  #ui {
    position:fixed; bottom:0; left:0; right:0; z-index:10;
    display:flex; flex-direction:column; align-items:center;
    padding-bottom:clamp(2rem,6vw,4rem); gap:clamp(1.6rem,3.5vw,2.4rem);
  }

  /* ── Sliders Panel ── */
  #sliders {
    display:flex; gap:clamp(1.8rem,5vw,3.5rem);
    align-items:flex-end;
  }
  .track {
    display:flex; flex-direction:column; align-items:center; gap:0.6rem;
  }
  .track-label {
    color:var(--silver-dim); font-size:clamp(0.55rem,1vw,0.65rem);
    letter-spacing:0.18em; text-transform:uppercase; font-weight:300;
  }
  /* 세로 슬라이더 */
  .track input[type=range] {
    -webkit-appearance: none; appearance: none;
    writing-mode: vertical-lr; direction: rtl;
    width:2px; height:clamp(60px,10vw,88px);
    background:transparent; cursor:pointer; outline:none;
    padding:0;
  }
  .track input[type=range]::-webkit-slider-runnable-track {
    width:2px; background:rgba(200,205,210,0.15); border-radius:1px;
  }
  .track input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:10px; height:10px; border-radius:50%;
    background:rgba(200,205,210,0.7);
    box-shadow:0 0 6px rgba(200,205,210,0.3);
    margin-left:-4px;
    transition:background var(--ease), box-shadow var(--ease);
  }
  .track input[type=range]:hover::-webkit-slider-thumb {
    background:rgba(200,205,210,1);
    box-shadow:0 0 10px rgba(200,205,210,0.5);
  }
  .track input[type=range]::-moz-range-track {
    width:2px; background:rgba(200,205,210,0.15); border-radius:1px;
  }
  .track input[type=range]::-moz-range-thumb {
    width:10px; height:10px; border-radius:50%; border:none;
    background:rgba(200,205,210,0.7);
  }

  /* ── Play Button ── */
  #toggle {
    display:flex; align-items:center; gap:0.7rem;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07);
    border-radius:9999px; padding:0.7rem 1.6rem; cursor:pointer;
    color:var(--silver); font-family:var(--font);
    font-size:clamp(0.7rem,1.3vw,0.8rem); font-weight:400;
    letter-spacing:0.14em; text-transform:uppercase;
    transition:background var(--ease), border-color var(--ease), color var(--ease);
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  #toggle:hover { background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.14); color:rgba(200,205,210,0.9); }
  #toggle:active { background:rgba(255,255,255,0.11); }
  #pip {
    width:6px; height:6px; border-radius:50%;
    background:rgba(200,205,210,0.28);
    transition:background 700ms cubic-bezier(0.16,1,0.3,1), box-shadow 700ms cubic-bezier(0.16,1,0.3,1);
    flex-shrink:0;
  }
  #pip.active { background:rgba(210,220,215,0.9); box-shadow:0 0 7px rgba(210,220,215,0.45); }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="loading">preparing</div>
<p id="title">Sine Relax 2</p>

<div id="ui">
  <div id="sliders">
    <div class="track">
      <input type="range" id="sl-drone"   min="0" max="100" value="80" aria-label="Drone volume">
      <span class="track-label">Drone</span>
    </div>
    <div class="track">
      <input type="range" id="sl-sheen"   min="0" max="100" value="70" aria-label="Sheen volume">
      <span class="track-label">Sheen</span>
    </div>
    <div class="track">
      <input type="range" id="sl-sparkle" min="0" max="100" value="55" aria-label="Sparkle volume">
      <span class="track-label">Sparkle</span>
    </div>
  </div>

  <button id="toggle" aria-label="Play or stop">
    <span id="pip"></span>
    <span id="label">Play</span>
  </button>
</div>

<script>
// ── Canvas: silver curtain ──
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// 시드 고정 난수 (mulberry32)
function makeRng(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = makeRng(7391);

// 은빛 커튼: 가로로 흐르는 얇은 레이어들
const VEIL_COUNT = 7;
const veils = Array.from({length: VEIL_COUNT}, (_, i) => ({
  y:      rng() * 1.4 - 0.2,          // 화면 세로 위치 (비율)
  vy:     (rng() - 0.5) * 0.00018,    // 매우 느린 수직 이동
  phase:  rng() * Math.PI * 2,
  speed:  0.00012 + rng() * 0.00016,  // 물결 속도
  amp:    0.04 + rng() * 0.06,        // 물결 진폭 (비율)
  alpha:  0.022 + rng() * 0.032,      // 투명도
  thick:  0.18 + rng() * 0.28,        // 두께 (비율)
  skew:   (rng() - 0.5) * 0.3,        // 기울기
}));

// 매우 작은 은빛 파티클 (sparkle 느낌)
const PARTICLE_COUNT = 38;
const particles = Array.from({length: PARTICLE_COUNT}, () => ({
  x: rng(), y: rng(),
  vx: (rng() - 0.5) * 0.00006,
  vy: (rng() - 0.5) * 0.00005,
  alpha: 0.04 + rng() * 0.1,
  phase: rng() * Math.PI * 2,
  speed: 0.0005 + rng() * 0.0008,
  r: 0.5 + rng() * 1.2,
}));

let isActive = false;

function drawFrame(t) {
  requestAnimationFrame(drawFrame);

  // 검은 베이스 (잔상 거의 없이 매 프레임 완전히)
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, W, H);

  const breathe = isActive ? 1 + 0.04 * Math.sin(t * 0.00022) : 1;

  // ── 은빛 커튼 레이어 ──
  for (const v of veils) {
    v.phase += v.speed;
    v.y += v.vy;
    if (v.y > 1.3) v.y = -0.3;
    if (v.y < -0.3) v.y = 1.3;

    const centerY = v.y * H + Math.sin(v.phase) * v.amp * H;
    const halfH   = v.thick * H * breathe * 0.5;
    const alphaVal = isActive ? v.alpha * (0.9 + 0.3 * Math.sin(v.phase * 0.6)) : v.alpha * 0.35;

    const grd = ctx.createLinearGradient(0, centerY - halfH, 0, centerY + halfH);
    grd.addColorStop(0,   `rgba(195,200,205,0)`);
    grd.addColorStop(0.3, `rgba(200,205,210,${alphaVal * 0.6})`);
    grd.addColorStop(0.5, `rgba(210,215,218,${alphaVal})`);
    grd.addColorStop(0.7, `rgba(200,205,210,${alphaVal * 0.6})`);
    grd.addColorStop(1,   `rgba(195,200,205,0)`);

    // 기울어진 커튼을 위해 transform 적용
    ctx.save();
    ctx.transform(1, v.skew * 0.15, 0, 1, 0, 0);
    ctx.fillStyle = grd;
    ctx.fillRect(-W * 0.1, centerY - halfH, W * 1.2, halfH * 2);
    ctx.restore();
  }

  // ── 미세 파티클 ──
  for (const p of particles) {
    p.phase += p.speed;
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
    if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;

    const pAlpha = isActive
      ? p.alpha * (0.6 + 0.7 * Math.abs(Math.sin(p.phase)))
      : p.alpha * 0.2;

    ctx.beginPath();
    ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(215,218,220,${pAlpha})`;
    ctx.fill();
  }
}
requestAnimationFrame(drawFrame);

// ── Web Audio ──
let audioCtx = null, masterGain = null;
const layers = { drone: null, sheen: null, sparkle: null };
const gains  = { drone: null, sheen: null, sparkle: null };
const nodes  = { drone: null, sheen: null, sparkle: null };
const files  = { drone: './1_drone.wav', sheen: './2_sheen.wav', sparkle: './3_sparkle.wav' };

let loadState = 'idle';
let isBusy    = false;

function hideLoading() {
  const el = document.getElementById('loading');
  if (!el) return;
  el.classList.add('hidden');
  setTimeout(() => el.remove(), 1500);
}

function ensureAudioContext() {
  if (audioCtx) return;
  audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  // 레이어별 GainNode 생성
  for (const key of Object.keys(gains)) {
    gains[key] = audioCtx.createGain();
    gains[key].gain.setValueAtTime(
      parseInt(document.getElementById('sl-' + key).value) / 100,
      audioCtx.currentTime
    );
    gains[key].connect(masterGain);
  }
}

function loadAudioElement(url) {
  return new Promise((resolve, reject) => {
    const audio = new Audio();
    audio.crossOrigin = 'anonymous';
    audio.preload = 'auto';
    audio.src = url;

    let done = false;
    const finish = (val) => { if (done) return; done = true; resolve(val); };
    const fail   = (e)   => { if (done) return; done = true; reject(e); };

    const timer = setTimeout(() => {
      if (audio.readyState >= 2) finish(audio); else fail(new Error('Timeout: ' + url));
    }, 12000);

    audio.addEventListener('canplaythrough', () => { clearTimeout(timer); finish(audio); });
    audio.addEventListener('error', (e) => { clearTimeout(timer); fail(e); });
    audio.load();

    const poll = setInterval(() => {
      if (audio.readyState >= 3) { clearInterval(poll); clearTimeout(timer); finish(audio); }
    }, 50);
    setTimeout(() => clearInterval(poll), 12500);
  });
}

async function loadBuffers() {
  if (loadState !== 'idle') return;
  loadState = 'loading';
  try {
    const [d, sh, sp] = await Promise.all([
      loadAudioElement(files.drone),
      loadAudioElement(files.sheen),
      loadAudioElement(files.sparkle),
    ]);
    layers.drone   = d;
    layers.sheen   = sh;
    layers.sparkle = sp;
    loadState = 'ready';
  } catch(e) {
    console.warn('[SR2] load failed:', e);
    loadState = 'error';
  }
  hideLoading();
}

function waitForLoad(ms = 14000) {
  return new Promise(resolve => {
    if (loadState === 'ready' || loadState === 'error') { resolve(loadState === 'ready'); return; }
    const t0 = Date.now();
    const check = () => {
      if (loadState === 'ready') { resolve(true); return; }
      if (loadState === 'error' || Date.now() - t0 > ms) { resolve(false); return; }
      setTimeout(check, 80);
    };
    check();
  });
}

function startLayer(key) {
  const el = layers[key];
  if (!el || !audioCtx) return;
  if (!nodes[key]) {
    nodes[key] = audioCtx.createMediaElementSource(el);
    nodes[key].connect(gains[key]);
  }
  el.loop = true;
  el.play().catch(e => console.warn(key + ' play:', e));
}

function stopLayer(key) {
  const el = layers[key];
  if (el) { el.pause(); el.currentTime = 0; }
}

function fadeIn() {
  const t = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(t);
  masterGain.gain.setValueAtTime(masterGain.gain.value, t);
  masterGain.gain.linearRampToValueAtTime(1.0, t + 3.0);
}

function fadeOut(cb) {
  const t = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(t);
  masterGain.gain.setValueAtTime(masterGain.gain.value, t);
  masterGain.gain.linearRampToValueAtTime(0, t + 3.0);
  setTimeout(() => {
    Object.keys(layers).forEach(stopLayer);
    if (cb) cb();
  }, 3200);
}

// ── 슬라이더 이벤트 ──
['drone', 'sheen', 'sparkle'].forEach(key => {
  const slider = document.getElementById('sl-' + key);
  slider.addEventListener('input', () => {
    const val = parseInt(slider.value) / 100;
    if (gains[key]) {
      const t = audioCtx.currentTime;
      gains[key].gain.cancelScheduledValues(t);
      gains[key].gain.setValueAtTime(gains[key].gain.value, t);
      gains[key].gain.linearRampToValueAtTime(val, t + 0.08);
    }
  });
});

// ── Toggle ──
const toggleBtn = document.getElementById('toggle');
const pip       = document.getElementById('pip');
const labelEl   = document.getElementById('label');

toggleBtn.addEventListener('click', async () => {
  if (isBusy) return;
  isBusy = true;

  ensureAudioContext();

  if (audioCtx.state === 'suspended') await audioCtx.resume();

  if (loadState === 'idle') loadBuffers();

  if (loadState !== 'ready' && loadState !== 'error') {
    const ok = await waitForLoad();
    if (!ok) { isBusy = false; return; }
  }

  if (!isActive) {
    isActive = true;
    pip.classList.add('active');
    labelEl.textContent = 'Stop';

    if (loadState === 'ready') {
      startLayer('drone');
      startLayer('sheen');
      startLayer('sparkle');
    }
    fadeIn();
    isBusy = false;

  } else {
    isActive = false;
    pip.classList.remove('active');
    labelEl.textContent = 'Play';
    fadeOut(() => { isBusy = false; });
  }
});

setTimeout(hideLoading, 10000);
</script>
</body>
</html>
